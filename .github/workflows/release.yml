name: Release

# Ein Release ist ein Tag vX.Y.Z auf main (siehe docs/RELEASE.md):
#   1. Tests, Version im Tag = VERSION in app/server.py = oberster Eintrag in app/CHANGELOG.md
#   2. Image ghcr.io/rheckly/immich-puzzle mit den Tags X.Y.Z und latest
#   3. GitHub-Release mit dem CHANGELOG-Abschnitt dieser Version
# Von Hand gestartet: nur Tests und Image mit Tag dev (z.B. nach einer Änderung an requirements.txt).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      - run: python -m unittest discover -s tests
      - run: python tests/check_texts.py
      - name: Version
        if: github.ref_type == 'tag'
        run: |
          v=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' app/server.py)
          top=$(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' app/CHANGELOG.md | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME passt nicht zu VERSION $v"; exit 1; }
          [ "$v" = "$top" ] || { echo "CHANGELOG oben $top passt nicht zu VERSION $v"; exit 1; }

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tags
        id: tags
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY,,}
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tags=$img:${GITHUB_REF_NAME#v},$img:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$img:dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}

  release:
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}
          {
            echo "Image: \`ghcr.io/${GITHUB_REPOSITORY,,}:$v\`"
            echo
            awk -v v="$v" '/^## /{p = ($2 == v); next} p' app/CHANGELOG.md
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Puzzle $v" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "Puzzle $v" --notes-file notes.md --latest --verify-tag
          fi
