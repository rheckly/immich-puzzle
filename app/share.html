<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Puzzle</title>
<link rel="icon" type="image/svg+xml" href="{{ROOT}}favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="{{ROOT}}brand/favicon-puzzle.png">
<style>
  /* Hinweisseite geteilter Link (Entscheid 52, Design-Vorlage Kap. 7): Karte wie die Login-Karte, Hell/Dunkel nach System */
  :root { color-scheme: light; --bg: #f4f4f2; --card: #fff; --text: #23272b; --muted: #667; --line: #dcdcd8;
    --accent: #2f6f8f; --on-accent: #fff; --err: #a4262c; --shadow: rgba(0,0,0,.15); }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --bg: #17191b; --card: #222528; --text: #e8e8e6; --muted: #a0a4a8; --line: #3a3e42;
      --accent: #6db3d6; --on-accent: #111; --err: #ff8a8f; --shadow: rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 32px 28px; max-width: 400px;
    width: 100%; text-align: center; box-shadow: 0 10px 40px var(--shadow); }
  .logo { height: 65px; display: flex; justify-content: center; align-items: center; margin-bottom: 18px; }
  .logo img { max-width: 100%; max-height: 65px; display: block; }
  h1 { font-size: 22px; margin: 0 0 10px; font-weight: 600; overflow-wrap: anywhere; }
  .kicker { color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 18px; }
  .s { margin: 0 0 8px; }
  .h { margin: 0; color: var(--muted); font-size: 15px; }
  form { text-align: left; margin-top: 18px; }
  form input { width: 100%; font: 16px system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0 0 14px; }
  form input.bad { border-color: var(--err); }
  form input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .go { width: 100%; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 8px; padding: 11px;
    font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer; }
  .go:disabled { opacity: .6; cursor: default; }
  .errbox { background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); border-radius: 8px;
    padding: 10px 12px; font-size: 14px; margin: 0 0 14px; }
  .foot { max-width: 400px; margin: 16px 0 0; text-align: center; color: var(--muted); font-size: 13px; }
  .foot a { color: var(--muted); }
</style>
{{UMAMI}}
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"><picture><source srcset="{{ROOT}}brand/puzzle-logo-dark.svg" media="(prefers-color-scheme: dark)"><img src="{{ROOT}}brand/puzzle-logo-light.svg" alt=""></picture></div>
  <p class="kicker">Puzzle</p>
  <h1>{{HEADING}}</h1>
  {{TEXT}}
</main>
<p class="foot">{{FOOT}}<br>{{OTHER}}</p>
</body>
</html>
