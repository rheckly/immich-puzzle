<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Puzzle</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-puzzle.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon-puzzle.png">
{{OG}}
<script>
// Hell oder dunkel wie die App: eigene Wahl aus der App (gleiche Adresse), sonst das System
(() => {
  let choice = null;
  try { choice = localStorage.getItem("theme"); } catch { /* Speicher gesperrt */ }
  const dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
})();
</script>
<!-- Aussehen wie im freigegebenen Mockup (gleiche Karte in Face-Timelapse, Mosaik und Reels, nur Logo und Name wechseln) -->
<style>
  /* App-Palette nach Theme (Design-Entscheid 1), gleich in Face-Timelapse, Mosaik und Reels */
  :root { color-scheme: light; --bg: #f4f4f2; --card: #fff; --text: #23272b; --muted: #667; --line: #dcdcd8;
    --accent: #2f6f8f; --on-accent: #fff; --err: #a4262c; --shadow: rgba(0,0,0,.15); }
  :root[data-theme=dark] { color-scheme: dark; --bg: #17191b; --card: #222528; --text: #e8e8e6; --muted: #a0a4a8; --line: #3a3e42;
    --accent: #6db3d6; --on-accent: #111; --err: #ff8a8f; --shadow: rgba(0,0,0,.5); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { background: var(--card); border-radius: 14px; padding: 32px 28px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 40px var(--shadow); }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 600; }
  .kicker { color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 2px; }
  .tagline { color: var(--muted); font-size: 13px; margin: 0 0 18px; }

  /* Wortmarke Puzzle aus brand/, passend zum Theme */
  .logo { height: 65px; display: flex; justify-content: center; align-items: center; margin-bottom: 18px; }
  .logo img { width: 65px; height: 65px; display: block; }
  .logo .dark, :root[data-theme=dark] .logo .light { display: none; }
  :root[data-theme=dark] .logo .dark { display: block; }

  /* Formular */
  form { text-align: left; margin-top: 8px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 5px; }
  input[type=text], input[type=password] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; margin-bottom: 14px; outline: none; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  input.bad { border-color: var(--err); }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text); margin: 2px 0 18px; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  button { width: 100%; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 8px; padding: 11px; font: 600 15px system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .err { background: color-mix(in srgb, var(--err) 10%, transparent); border: 1px solid color-mix(in srgb, var(--err) 35%, transparent); color: var(--err); font-size: 14px; border-radius: 8px; padding: 8px 12px; margin: 0 0 14px; text-align: left; }
  .foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 18px; }
  .foot a { color: var(--muted); text-decoration: none; }
  .foot a:hover { color: var(--text); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"><img class="light" src="/brand/puzzle-logo-light.svg" alt=""><img class="dark" src="/brand/puzzle-logo-dark.svg" alt=""></div>
  <p class="kicker">Puzzle</p>
  <p class="tagline">Photo puzzles from your Immich library</p>
  <h1 data-i18n="login.title"></h1>
  <form id="form" novalidate>
    <label for="user" data-i18n="login.user"></label><input id="user" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="pass" data-i18n="login.password"></label><input id="pass" type="password" name="password" autocomplete="current-password" required>
    <div id="err" class="err hidden" role="alert"></div>
    <label class="check"><input id="remember" type="checkbox" checked> <span data-i18n="login.remember"></span></label>
    <div id="lockErr" class="err hidden" role="alert"></div>
    <button id="submit" type="submit" data-i18n="login.submit"></button>
  </form>
  <div class="foot"><span>Version {{VERSION}}</span><a id="otherLang" href="#"></a></div>
</main>
{{I18N}}<script>
const $ = id => document.getElementById(id);
// Sprachwahl unten rechts: zeigt die jeweils andere Sprache
function drawOtherLang() {
  const other = lang === "de" ? "en" : "de";
  $("otherLang").textContent = t(`lang.${other}`);
  $("otherLang").lang = other;
}
document.addEventListener("DOMContentLoaded", drawOtherLang);
onLang(drawOtherLang);
$("otherLang").addEventListener("click", e => { e.preventDefault(); setLang(lang === "de" ? "en" : "de"); });

// Die Meldung bleibt beim Sprachwechsel stehen und kommt in der neuen Sprache
let shown = null;  // { box, fn }
function showError(box, fn) {
  $("err").classList.add("hidden"); $("lockErr").classList.add("hidden");
  $("pass").classList.remove("bad");
  shown = fn ? { box, fn } : null;
  if (!shown) return;
  $(box).textContent = fn();
  $(box).classList.remove("hidden");
  if (box === "err") $("pass").classList.add("bad");
}
onLang(() => { if (shown) $(shown.box).textContent = shown.fn(); });

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("submit").disabled = true;
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("user").value, password: $("pass").value, remember: $("remember").checked }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      const next = new URLSearchParams(location.search).get("next") || "/";
      location.replace(next.startsWith("/") && !next.startsWith("//") && !next.startsWith("/\\") ? next : "/");
      return;
    }
    if (res.status === 429) {
      startLock(Number(res.headers.get("Retry-After")) || Number(data.retry_after) || 300);
    } else if (res.status === 401) {
      showError("err", () => t("login.wrong"));
      $("pass").select();
    } else {
      showError("err", () => srvText(data, "error") || t("login.failed", { status: String(res.status) }));
    }
  } catch {
    showError("err", () => t("login.offline"));
  } finally {
    if (!lockUntil) $("submit").disabled = false;
  }
});

// Anmeldesperre (Entscheid 33): Meldung über dem Knopf, Knopf gesperrt mit Countdown «Anmelden (4:59)»
let lockUntil = 0, lockTimer = null;
function startLock(seconds) {
  lockUntil = Date.now() + seconds * 1000;
  const n = Math.max(1, Math.ceil(seconds / 60));
  showError("lockErr", () => t("login.tooMany", { n }));
  clearInterval(lockTimer);
  lockTimer = setInterval(drawLock, 1000);
  drawLock();
}
function drawLock() {
  const left = Math.ceil((lockUntil - Date.now()) / 1000);
  if (left <= 0) {
    clearInterval(lockTimer); lockUntil = 0;
    $("submit").disabled = false;
    $("submit").textContent = t("login.submit");
    if (shown && shown.box === "lockErr") showError(null);
    return;
  }
  $("submit").disabled = true;
  $("submit").textContent = `${t("login.submit")} (${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")})`;
}
onLang(() => { if (lockUntil) drawLock(); });
// ---------- Entscheid 42: «Zurück» aus dem Seiten-Cache (Safari bfcache, iPhone) ----------
// Aus Collage übernommen, braucht nur GET /api/auth/session ({enabled, user}).
// Holt «Zurück» diese Seite aus dem Speicher, statt sie zu laden, leitet der Server nicht um (GET /login mit Sitzung → 303).
// Dann hier die Sitzung neu prüfen und bei gültiger Anmeldung mit replace weiter, statt das Formular aus dem Cache zu zeigen.
window.addEventListener("pageshow", async event => {
  if (!event.persisted) return;
  try {
    const res = await fetch("/api/auth/session", {cache: "no-store"});
    const session = res.ok ? await res.json() : null;
    if (!session || (session.enabled && !session.user)) return;  // Nicht angemeldet: das Formular bleibt
    const next = new URLSearchParams(location.search).get("next") || "/";
    location.replace(next.startsWith("/") && !next.startsWith("//") && !next.startsWith("/\\") ? next : "/");
  } catch { /* Ohne Antwort bleibt das Formular */ }
});
// ---------- Ende Entscheid 42 ----------
$("user").focus();
</script>
</body>
</html>
